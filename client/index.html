<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CDT Resource Finder</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ELJ5N8K01R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ELJ5N8K01R');
  </script>
</head>
  <body>
    <!-- ✅ Must exist before googleTranslateElementInit runs -->
    <div id="google_translate_element" style="display:none"></div>

    <div id="root"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (!window.google || !window.google.translate) return;

        // Clear any previous render (helps with reloads)
        var el = document.getElementById("google_translate_element");
        if (el) el.innerHTML = "";

        new window.google.translate.TranslateElement(
          { pageLanguage: "en", autoDisplay: false },
          "google_translate_element"
        );
      }
    </script>
    <script type="text/javascript" src="https://resources.technology.ca.gov/calendar/iframeResizer.contentWindow.min.js"></script>
    <script>
            $(window).unload(function () {

                if ('parentIFrame' in window) {
                    parentIFrame.scrollTo(0, 450);
                }
            });
    </script>
 

    <script
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      type="text/javascript"
    ></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
